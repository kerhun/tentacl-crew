name: AgentPanel
options:
  bundleIdPrefix: com.kerhun
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.99.1
targets:
  tentacld:   # the PTY daemon (N228); copied into Tentacl.app/Contents/Helpers
    type: tool
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    platform: macOS
    sources: [tentacld]
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: tentacld
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  AgentPanel:
    type: application
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    platform: macOS
    sources: [AgentPanel]
    postCompileScripts:   # Xcode's generated plist writes CFBundleName = product name (the key setting is ignored); the app menu and About read it, so a localized InfoPlist.strings overrides it
      - name: Set CFBundleName
        script: |
          d="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/en.lproj"
          mkdir -p "$d" && printf '"CFBundleName" = "%s";\n' "$INFOPLIST_KEY_CFBundleName" > "$d/InfoPlist.strings"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: SwiftTerm   # the live terminal view (N231)
        product: SwiftTerm
      - target: tentacld
        link: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kerhun.Tentacl
        PRODUCT_NAME: Tentacl
        PRODUCT_MODULE_NAME: AgentPanel   # the Swift module keeps its name; only what the user sees is Tentacl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tentacl Crew
        INFOPLIST_KEY_CFBundleName: Tentacl Crew
        INFOPLIST_FILE: AgentPanel/Info.extra.plist   # merged into the generated one: the release label (Beta 1)
        TENTACL_RELEASE_LABEL: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: AgentPanel/AgentPanel.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:   # the build in the repository (test host) is a different app, so Spotlight and Launchpad show only the stable Tentacl
          PRODUCT_BUNDLE_IDENTIFIER: com.kerhun.Tentacl.dev
          PRODUCT_NAME: Tentacl Dev
          INFOPLIST_KEY_CFBundleDisplayName: Tentacl Crew Dev
          INFOPLIST_KEY_CFBundleName: Tentacl Crew Dev
  AgentPanelTests:
    type: bundle.unit-test
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    platform: macOS
    sources:
      - path: AgentPanelTests
        excludes: ["Fixtures/**"]
    dependencies:
      - target: AgentPanel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kerhun.TentaclTests
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tentacl Dev.app/Contents/MacOS/Tentacl Dev
        Release:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tentacl.app/Contents/MacOS/Tentacl
  AgentPanelUITests:
    type: bundle.ui-testing
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    platform: macOS
    sources: [AgentPanelUITests]
    dependencies:
      - target: AgentPanel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kerhun.TentaclUITests
        TEST_TARGET_NAME: AgentPanel
schemes:
  AgentPanel:
    build:
      targets:
        AgentPanel: all
    test:
      targets: [AgentPanelTests]
  AgentPanelUI:   # scripts/ui-smoke.sh; not part of the AgentPanel scheme, so app-test.sh and the review packet do not run it
    build:
      targets:
        AgentPanel: all
    test:
      targets: [AgentPanelUITests]
